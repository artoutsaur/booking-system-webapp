{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 mt-5">
            <div class="card-header bg-primary text-white text-center py-4">
                <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Регистрация</h4>
                <small>Создайте аккаунт для бронирования мест</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" class="form-control" id="username" placeholder="ivan_ivanov" required>
                        </div>
                    </div>
                    <!-- УДАЛЕН блок с email -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" id="password" placeholder="********" required>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Зарегистрироваться</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-light">
                <div class="small text-muted">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></div>
            </div>
        </div>
        
        <div class="alert alert-info mt-4 border-0 shadow-sm">
            <i class="fas fa-info-circle me-2"></i> <strong>Совет:</strong> Первый зарегистрированный пользователь получит полные права управления системой.
        </div>
    </div>
</div>
{% endblock %}
