{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-desktop me-2 text-primary"></i>Доступные рабочие места</h2>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Назад</a>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for wp in workplaces %}
    <div class="col">
        <div class="card h-100 shadow-sm border-0">
            <div class="card-body">
                <h5 class="card-title">{{ wp.name }}</h5>
                <p class="card-text text-muted small">Готово к бронированию</p>
            </div>
            <div class="card-footer bg-transparent border-0 pb-3">
                <a href="{{ url_for('bookings.new_booking', workplace_id=wp.id) }}" class="btn btn-primary w-100">
                    Выбрать это место
                </a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12 text-center py-5">
        <p class="text-muted fs-4">Места еще не добавлены администратором.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
