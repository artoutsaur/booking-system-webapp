{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="fas fa-history text-muted me-2"></i>Логи системы</h3>
    <a href="{{ url_for('admin.statistics') }}" class="btn btn-light">К статистике</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Время</th>
                        <th>Пользователь</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td class="text-muted small">{{ log.created_at.strftime('%d.%m.%Y %H:%M:%S') }}</td>
                        <td><strong>{{ log.user.username }}</strong></td>
                        <td>{{ log.action }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
